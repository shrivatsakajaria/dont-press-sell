<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: #f3e2d0; color: #1c1a17; font-family: 'Newsreader', Georgia, serif; display: flex; flex-direction: column">

    <span>Price: your nerve</span>
  </div>
  <h1 style="margin: 20px 0 0; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: -0.02em; text-wrap: balance">A major bank freezes three of its funds</h1>

    <polyline fill="none" stroke="#1c1a17" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="0,110 9,106 18,108 27,101 36,104 45,96 54,99 63,92 72,97 81,104 90,98"></polyline>
    <circle cx="90" cy="98" r="6" fill="#1c1a17"></circle>
    <text x="238" y="104" fill="#4a443c" font-family="'Libre Franklin', Arial, sans-serif" font-weight="500" font-size="12">Started at $10,000</text>
  </svg>
  <div style="margin-top: 16px; display: flex; align-items: baseline; justify-content: space-between">
    <div style="font-weight: 700; font-size: 72px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: lining-nums tabular-nums">$10,340</div>
    <div style="font-family: 'Libre Franklin', Arial, sans-serif; font-weight: 700; font-size: 16px; line-height: 1.25; text-align: right; font-variant-numeric: tabular-nums">up<br>$340</div>
  </div>
  <div style="flex-grow: 1"></div>
  <button type="button" style="width: 100%; height: 72px; border: 0; border-radius: 0; background: #1c1a17; color: #f3e2d0; font-family: 'Libre Franklin', Arial, sans-serif; font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; cursor: pointer">Sell for $10,340</button>
  <div style="margin-top: 12px; font-family: 'Libre Franklin', Arial, sans-serif; font-weight: 500; font-size: 12px; line-height: 1.35; color: #4a443c">US stock market · Not financial advice</div>
